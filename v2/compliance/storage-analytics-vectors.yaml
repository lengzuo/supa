# Deliberate divergences from storage-js (see storage.IcebergCatalog docs):
# - The Iceberg catalog follows iceberg-js 1.0.0 / the Iceberg REST spec,
#   while storage-js pins iceberg-js ^0.8.1 (which lacks renameTable,
#   registerTable and updateNamespaceProperties and never calls /v1/config).
# - /v1/config is fetched once per catalog (single-flight, each caller
#   honors its own context). The bucket-name fallback prefix is cached only
#   when the server returns no prefix or a non-auth HTTP error; 401/403/419,
#   network and context errors are returned and retried on the next call.
#   The server prefix is used verbatim; unsafe prefixes are rejected.
# - Empty, "." and ".." bucket names, namespace levels and table names are
#   rejected with *storage.AnalyticsArgumentError before any request.
features:
  storage.analytics.create_analytics_bucket:
    status: implemented
    symbols: [storage.Client.Analytics, storage.AnalyticsAPI.CreateBucket]
    tests: [TestAnalyticsCreateBucket, TestAnalyticsBucketError, TestIcebergRejectsDotSegments]
    reason: ""
