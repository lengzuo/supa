# Deliberate divergences from storage-js (see storage.IcebergCatalog docs):
# - The Iceberg catalog follows iceberg-js 1.0.0 / the Iceberg REST spec,
#   while storage-js pins iceberg-js ^0.8.1 (which lacks renameTable,
#   registerTable and updateNamespaceProperties and never calls /v1/config).
# - /v1/config is fetched once per catalog (single-flight; each caller
#   honors its own context; a panic becomes an error and never wedges the
#   catalog). Prefix = overrides.prefix if present, else defaults.prefix
#   (iceberg-js `??` semantics); an empty prefix falls back to the bucket.
# - The bucket-name fallback is cached only for an empty/absent prefix or a
#   400/404/405/501 answer from /v1/config. Auth errors, 429, other 5xx,
#   network and context errors are returned and retried on the next call
#   (iceberg-js caches the fallback after any failure).
# - The server prefix is used verbatim but must be RFC 3986 pchar only;
#   decoded segments may not contain a "." or ".." component. Unsafe
#   prefixes fail the call and are not cached.
# - Bucket names follow the full Storage naming rules (also in CreateBucket
#   and DeleteBucket). Namespace levels and table names must not be empty,
#   "." or "..", or contain "/" or "\"; namespace levels also must not
#   contain 0x1F. Violations return *storage.AnalyticsArgumentError before
#   any request is sent.
