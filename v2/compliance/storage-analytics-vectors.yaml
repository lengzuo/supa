  storage.analytics.create_analytics_bucket:
    status: implemented
    symbols: [storage.Client.Analytics, storage.AnalyticsAPI.CreateBucket]
    tests: [TestAnalyticsCreateBucket, TestAnalyticsBucketError, TestIcebergRejectsDotSegments]
    reason: ""
